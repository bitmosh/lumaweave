<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LumaWeave · Settings (iteration 1)</title>
  <meta name="viewport" content="width=1280" />

  <!-- Fonts: Space Grotesk (display), IBM Plex Sans (body), IBM Plex Mono (mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="src/styles.css" />

  <!-- Initial theme variables — overwritten by applyTheme() once the JS boots -->
  <style>
    :root {
      --lw-app-bg: #1a0d22;
      --lw-panel-bg: rgba(40, 18, 48, 0.78);
      --lw-panel-bg-solid: #281230;
      --lw-panel-border: rgba(255, 140, 110, 0.32);
      --lw-text-primary: #fde3d0;
      --lw-text-muted: #a48a92;
      --lw-accent: #ff8a5b;
      --lw-glow: rgba(255, 110, 80, 0.55);
      --lw-color-flare-500:   #ff7a4a;
      --lw-color-magenta-500: #ff52a8;
      --lw-color-purple-500:  #b56cff;
      --lw-color-gold-500:    #ffc857;
    }
  </style>

  <!-- React 18 + Babel with TypeScript preset enabled. The data-presets
       attribute on each <script type="text/babel"> tells Babel to apply the
       TypeScript transform in addition to React/JSX. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>

  <!-- ─── Files load in dependency order. Each is its own text/babel script,
           so the TypeScript preset must be re-declared per file. ───────────── -->

  <!-- 1. Tokens + fixture data (no React deps; pin to window.LW_*) -->
  <script type="text/babel" data-presets="typescript,react" src="src/theme-tokens.ts"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/settings-data.ts"></script>

  <!-- 2. Background canvas (depends only on React) -->
  <script type="text/babel" data-presets="typescript,react" src="src/faux-graph.tsx"></script>

  <!-- 3. Atomic UI primitives -->
  <script type="text/babel" data-presets="typescript,react" src="src/SettingsRows.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/SettingsContent.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/SettingsSidebar.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/SettingsStatusBar.tsx"></script>

  <!-- 4. Categories (depend on the row primitives + inspector internals) -->
  <script type="text/babel" data-presets="typescript,react" src="src/inspector-internals.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/category-theme.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/category-others.tsx"></script>

  <!-- 5. The panel shell + host chrome -->
  <script type="text/babel" data-presets="typescript,react" src="src/SettingsPanel.tsx"></script>
  <script type="text/babel" data-presets="typescript,react" src="src/Topbar.tsx"></script>

  <!-- 6. Wire everything together -->
  <script type="text/babel" data-presets="typescript,react" src="src/app.tsx"></script>
</body>
</html>
