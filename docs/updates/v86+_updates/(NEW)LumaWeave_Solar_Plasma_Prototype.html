    <style>
      :root { color-scheme: dark; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #03000A;
        color: #FFE9D6;
        font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      /* ---- Loading overlay (hidden once #root has children) ---- */
      .lw-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background:
          radial-gradient(ellipse 90% 70% at 50% 50%, #1B0830 0%, #0E0420 45%, #03000A 100%);

      .lw-loading-orb {
        width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #fff 0%, #FFB347 30%, #FF6B1A 60%, transparent 75%);
        box-shadow:

      .lw-loading-tag { color: #FFB347; }
      .lw-loading-sub { color: rgba(255,215,188,0.55); font-size: 9.5px; }

      /* ---- Error banner (shown if anything blows up) ---- */
      .lw-errbar {
        position: fixed; left: 0; right: 0; top: 0; z-index: 10000;
        padding: 10px 14px;
        background: linear-gradient(180deg, #2a0708, #1a0405);
        color: #ffd6d8; border-bottom: 1px solid #ff4d6d;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
        white-space: pre-wrap; line-height: 1.45;
        max-height: 60vh; overflow: auto;
        display: none;
      }
      .lw-errbar[data-show="1"] { display: block; }
      .lw-errbar code { background: rgba(255,77,109,0.10); padding: 1px 4px; border-radius: 3px; }
      .lw-errbar h4 { margin: 0 0 6px; color: #ff8a98; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }

              also respects this via the Reduce Motion toggle, but a viewer
              with reduce-motion set should never see anything spinning). */
      @media (prefers-reduced-motion: reduce) {
        .lw-loading-orb { animation: none; }
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

<body>
    <!-- Surface uncaught errors before the user has to open DevTools. -->
    <div id="lw-errbar" class="lw-errbar" role="alert" aria-live="assertive">
      <h4>Prototype error</h4>
      <div id="lw-errbar-body"></div>
    </div>

    <!-- Loading overlay: removed once React mounts something into #root. -->
    <div id="lw-loading" class="lw-loading" aria-busy="true">
      <div class="lw-loading-orb" aria-hidden="true"></div>
      <div class="lw-loading-tag">LumaWeave · Solar Plasma</div>
      <div class="lw-loading-sub">compiling reference prototype</div>
    </div>

    <div id="root"></div>

    <script>
    // ----- Error surface (must run before any <script type="text/babel">) ----
    (function () {
      var bar  = document.getElementById('lw-errbar');
      var body = document.getElementById('lw-errbar-body');
      function show(msg) {
        if (!bar || !body) return;
        body.textContent = (body.textContent ? body.textContent + '\n\n' : '') + msg;
        bar.setAttribute('data-show', '1');
      }
      window.addEventListener('error', function (e) {
        var src = e.filename || '<inline>';
        var loc = e.lineno ? (':' + e.lineno + (e.colno ? ':' + e.colno : '')) : '';
        show('error · ' + src + loc + '\n' + (e.message || e.error || 'unknown'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('unhandled promise · ' + (e.reason && e.reason.stack || e.reason || 'unknown'));
      });
      // Hide the loading overlay once #root has been mounted into.
      var loading = document.getElementById('lw-loading');
      if (loading) {
        var root = document.getElementById('root');
        var mo = new MutationObserver(function () {
          if (root && root.children.length > 0) {
            loading.setAttribute('data-hidden', '1');
            setTimeout(function () { loading.parentNode && loading.parentNode.removeChild(loading); }, 400);
            mo.disconnect();
          }
        });
        mo.observe(root, { childList: true });
        // Hard timeout so a silent failure doesn't leave the user staring at
        // a loading orb forever.
        setTimeout(function () {
          if (root && root.children.length === 0) {
            show('compile timeout · React did not mount within 15s. Check console for Babel errors.');
            loading.setAttribute('data-hidden', '1');
          }
        }, 15000);
      }
    })();
    </script>

    <script type="text/babel" data-presets="react" data-module="graph-data">
/* global window */
// Solar Plasma palette
const SP = {
  voidDeep:   "#03000A",
  voidMid:    "#0E0420",
  voidWarm:   "#1B0830",
  coronaBlue: "#4FACFF",
  coronaCyan: "#00D4FF",
  flareOrange:"#FF6B1A",
  flareGold:  "#FFB347",
  magenta:    "#FF1F8F",
  fuchsia:    "#CC2EFA",
  purple:     "#7B2FFF",
  ink:        "#FFE9D6",
  muted:      "rgba(255, 215, 188, 0.55)",
  faint:      "rgba(255, 215, 188, 0.32)",
  goldBorder: "rgba(255, 179, 71, 0.32)",
  goldBorderHot: "rgba(255, 179, 71, 0.62)",
};

// Node kinds → color
const KIND = {
  shell:  { color: SP.flareGold,    name: "shell"   },
  store:  { color: SP.coronaBlue,   name: "store"   },
  render: { color: SP.flareOrange,  name: "render"  },
  theme:  { color: SP.magenta,      name: "theme"   },
  panel:  { color: SP.purple,       name: "panel"   },
  qa:     { color: SP.fuchsia,      name: "qa"      },
  graph:  { color: SP.coronaCyan,   name: "graph"   },
  fixture:{ color: "#7CF6B5",       name: "fixture" },
};

// Deterministic PRNG
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Pre-named module labels
const NAMES = [
  "AppShell","useSettingsStore","SigmaGraphView","buildGraphologyGraph","themePresets",
  "ControlDock","LeftTabPanel","QaPanel","graphVisualTokens","settings.schema",
  "InspectorPanel","applyTheme","getRelationshipNeighborhood","CommandPalette","selectionState",
  "themeTokens","resolveGraphVisualTokens","ThemeTargetInspectorOverlay","panel-registry","CollapsiblePanel",
  "CollapsibleSection","Tile","SettingsPanel","SourceAdapterPanel","sourceAdapterRegistry",
  "useGraphSourceSummary","loadGraphifySource","normalizeGraphifyGraph","graphLabelPolicy","graphStylePolicy",
  "applyGraphLabelPolicy","SystemIndexPanel","systemIndexRegistry","CommandDeckPanel","CommandDeckShell",
  "command-registry","feature-flags","feature-registry","controlSurfaceContract","handleset.registry",
  "perspectiveRegistry","controlPlaneModeRegistry","advisory-registry","qa-registry","qa.store",
  "qa.types","settings.defaults","settings.migrations","settings.store","settings.registry",
  "themeOverrideStorage","themeTargetHeuristics","themeTokenGovernance","themeTokenPaths","themeTargetRegistry",
  "self-graph-adapter","self-graph-generated","fixtures/types","graphifyAdapter","jsonlAdapter",
  "cypherBridge","graphViewElementRegistry","graphVisualThemeMapping","Tile","DockLayout",
  "GraphVisualInventoryPanel","ThemeMappingPanel","panel.types","motionSafetyRegistry","audioSourceRegistry",
  "musicReactiveMapping","syntheticAudioSignal","useTabRegistry","useDockState","useFixtureMode",
  "useTheme","usePanelLayout","useCommandDeck","useQaAdvisories","useSourceAdapter",
  "renderEdges","renderNodes","cameraController","selectionMachine","hoverMachine",
  "edgeBundling","layoutWorker","barnesHutSolver","fa2Solver","linLogSolver",
  "labelOcclusion","labelTruncation","tokenResolver","tokenInheritance","schemaMigration",
  "advisoryEngine","provenanceTracker","sourceManifest","graphReport","fixtureBuilder",
  "neighborhoodWalker","centralityRanker","communityDetector","clusterPainter","spectrumGradient",
];

function clusterGen(seed = 7) {
  const rand = mulberry32(seed);
  const clusters = [
    { cx: 0.50, cy: 0.50, r: 0.10, kind: "shell",   count: 4  }, // core
    { cx: 0.30, cy: 0.42, r: 0.16, kind: "store",   count: 14 },
    { cx: 0.55, cy: 0.32, r: 0.18, kind: "theme",   count: 16 },
    { cx: 0.66, cy: 0.55, r: 0.18, kind: "render",  count: 16 },
    { cx: 0.36, cy: 0.66, r: 0.16, kind: "panel",   count: 14 },
    { cx: 0.72, cy: 0.74, r: 0.14, kind: "qa",      count: 12 },
    { cx: 0.20, cy: 0.78, r: 0.13, kind: "fixture", count: 10 },
    { cx: 0.82, cy: 0.30, r: 0.13, kind: "graph",   count: 14 },
  ];
  const nodes = [];
  let nameIdx = 0;
  clusters.forEach((c, ci) => {
    for (let i = 0; i < c.count; i++) {
      const a = rand() * Math.PI * 2;
      const rr = Math.sqrt(rand()) * c.r;
      const x = c.cx + Math.cos(a) * rr * 1.2;
      const y = c.cy + Math.sin(a) * rr * 1.0;
      const importance = i === 0 ? 1.0 : 0.25 + rand() * 0.6;
      nodes.push({
        id: `n${ci}_${i}`,
        x, y,
        kind: c.kind,
        importance,
        label: NAMES[nameIdx++ % NAMES.length],
        cluster: ci,
        degree: 0,
      });
    }
  });
  return { nodes, clusters };
}

function buildEdges(nodes, seed = 11) {
  const rand = mulberry32(seed);
  const edges = [];
  const byCluster = {};
  nodes.forEach((n, i) => {
    (byCluster[n.cluster] ||= []).push(i);
  });

  // intra-cluster
  Object.values(byCluster).forEach((arr) => {
    const hub = arr[0];
    arr.forEach((idx, j) => {
      if (j === 0) return;
      if (rand() < 0.65) edges.push([hub, idx]);
      // some peer connections
      if (j > 1 && rand() < 0.18) {
        edges.push([arr[1 + Math.floor(rand() * (arr.length - 1))], idx]);
      }
    });
  });

  // inter-cluster: hub-hub + a few cross
  const hubs = Object.values(byCluster).map((a) => a[0]);
  for (let i = 0; i < hubs.length; i++) {
    for (let j = i + 1; j < hubs.length; j++) {
      if (rand() < 0.55) edges.push([hubs[i], hubs[j]]);
    }
  }
  // sparse cross-cluster
  for (let k = 0; k < 14; k++) {
    const a = Math.floor(rand() * nodes.length);
    const b = Math.floor(rand() * nodes.length);
    if (a !== b && nodes[a].cluster !== nodes[b].cluster) edges.push([a, b]);
  }

  // dedupe
  const seen = new Set();
  const out = [];
  edges.forEach(([a, b]) => {
    const k = a < b ? `${a}-${b}` : `${b}-${a}`;
    if (seen.has(k)) return;
    seen.add(k);
    nodes[a].degree++; nodes[b].degree++;
    out.push({ source: a, target: b, kind: nodes[a].kind });
  });
  return out;
}

const _graph = (() => {
  const { nodes, clusters } = clusterGen();
  const edges = buildEdges(nodes);
  // size from degree + importance
  nodes.forEach((n) => {
    n.r = 4 + Math.min(7, n.degree * 0.5) + n.importance * 6;
    n.color = KIND[n.kind].color;
  });
  return { nodes, edges, clusters };
})();

// Floating bookmarks/alerts (not connected to graph)
const BOOKMARKS = [
  { id: "bm1", x: 0.16, y: 0.16, r: 22, color: "#FF4D6D", type: "alert",    label: "PROVENANCE GAP", sub: "advisory-204 · 3 nodes" },
  { id: "bm2", x: 0.86, y: 0.18, r: 18, color: SP.flareGold, type: "pinned", label: "SigmaGraphView", sub: "pinned · render" },
  { id: "bm3", x: 0.92, y: 0.74, r: 14, color: SP.coronaCyan, type: "ref",   label: "FA2 SOLVER",     sub: "reference · barnesHut" },
  { id: "bm4", x: 0.10, y: 0.86, r: 14, color: SP.fuchsia,    type: "alert", label: "QA · 1 fail",    sub: "themeTokens.spec" },
];

window.SP = SP;
window.KIND = KIND;
window.GRAPH = _graph;
window.BOOKMARKS = BOOKMARKS;

    </script>

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;

    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}

`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(true);  // standalone: auto-open
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

    </script>

    <script type="text/babel" data-presets="react" data-module="tile-system">
/* global React, SP */
const { useState: useStateT, useRef: useRefT, useEffect: useEffectT, useMemo: useMemoT, useCallback: useCallbackT } = React;

const TILE_GRID = 16;       // snap step (px)
const SNAP_TOLERANCE = 22;  // tiles within this distance auto-snap edge-to-edge
const COLLAPSED_H = 30;
const HEADER_H = 28;
const MIN_W = 200, MIN_H = 110;

const snap = (v) => Math.round(v / TILE_GRID) * TILE_GRID;

// --- TileContext: registry of "tilable" sections + tile state machine ----
const TileCtx = React.createContext(null);

function TileProvider({ children, registry }) {
  // registry: { [sectionKey]: { title, content: ()=>JSX, originPanel: "left"|"right" } }
  const [tiles, setTiles] = useStateT([]); // {id, sectionKey, x, y, w, h, collapsed, z}
  const zCounter = useRefT(10);

  // Tile out: convert a section into a floating tile. Returns true if added.
  const tileOut = useCallbackT((sectionKey, atPos) => {
    if (tiles.find(t => t.sectionKey === sectionKey)) return false;
    const id = `tile_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,5)}`;
    const x = atPos?.x ?? snap(window.innerWidth / 2 - 160);
    const y = atPos?.y ?? snap(120 + tiles.length * 30);
    setTiles(prev => [...prev, {
      id, sectionKey, x, y, w: 320, h: 220, collapsed: false, z: ++zCounter.current
    }]);
    return true;
  }, [tiles]);

  const closeTile = useCallbackT((id) => setTiles(prev => prev.filter(t => t.id !== id)), []);
  const closeGroup = useCallbackT((groupIds) => setTiles(prev => prev.filter(t => !groupIds.includes(t.id))), []);
  const updateTile = useCallbackT((id, patch) => setTiles(prev => prev.map(t => t.id === id ? { ...t, ...patch } : t)), []);
  const bring = useCallbackT((id) => setTiles(prev => prev.map(t => t.id === id ? { ...t, z: ++zCounter.current } : t)), []);

  const isTiledOut = useCallbackT((sectionKey) => !!tiles.find(t => t.sectionKey === sectionKey), [tiles]);

  return (
    <TileCtx.Provider value={{ tiles, registry, tileOut, closeTile, closeGroup, updateTile, bring, isTiledOut }}>
      {children}
    </TileCtx.Provider>
  );
}
const useTiles = () => React.useContext(TileCtx);

// --- TileableSection wrapper for left/right panel sections ----
function TileableSection({ sectionKey, title, children, accent = SP.flareGold, defaultOpen = true }) {
  const ctx = useTiles();
  const [open, setOpen] = useStateT(defaultOpen);
  const ref = useRefT(null);
  const tiledOut = ctx?.isTiledOut(sectionKey);

  const startTearOff = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (tiledOut) return;
    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    const onMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 8) {
        dragging = true;
        // tear off at cursor pos
        ctx.tileOut(sectionKey, { x: snap(ev.clientX - 60), y: snap(ev.clientY - 14) });
      }
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  return (
    <div className={`tsec ${tiledOut ? "tiled" : ""}`} ref={ref}>
      <div className="tsec-head">
        <button className="tsec-toggle" onClick={() => setOpen(o => !o)}
                style={{ color: accent }} disabled={tiledOut}>
          <span className="tsec-caret">{open ? "▾" : "▸"}</span>
          <span className="tsec-title">{title}</span>
        </button>
        <span className="tsec-spacer"/>
        <button className="tsec-tear" title={tiledOut ? "Already tiled out" : "Drag to tear off as tile"}
                onMouseDown={startTearOff} disabled={tiledOut}>
          <span className="tsec-tear-glyph">⤴</span>
        </button>
      </div>
      {open && !tiledOut && <div className="tsec-body">{children}</div>}
      {tiledOut && (
        <div className="tsec-ghost">
          <span>Tiled out</span>
          <span className="tsec-ghost-dot"/>
        </div>
      )}
      <style>{`
        .tsec { margin-bottom: 8px; border: 1px solid rgba(255,179,71,0.10);
                background: rgba(11,4,22,0.50); border-radius: 8px; overflow: hidden; }
        .tsec.tiled { opacity: 0.42; border-style: dashed; background: rgba(11,4,22,0.20); }
        .tsec-head { display: flex; align-items: center; gap: 6px;
                     padding: 6px 8px; border-bottom: 1px solid rgba(255,179,71,0.08); }
        .tsec-toggle { background: transparent; border: none; padding: 0; cursor: pointer;
                       display: flex; align-items: center; gap: 6px;
                       font-family: "Space Grotesk", system-ui, sans-serif;
                       font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
        .tsec-toggle:disabled { cursor: not-allowed; }
        .tsec-caret { font-size: 9px; opacity: 0.7; }
        .tsec-spacer { flex: 1; }
        .tsec-tear { background: transparent; border: 1px solid transparent;
                     padding: 2px 6px; border-radius: 6px; cursor: grab;
                     color: ${SP.muted}; font-size: 12px; }
        .tsec-tear:hover:not(:disabled) {

// --- Group computation: tiles snapped edge-to-edge form a group ----
// Returns { groups: [{id, tileIds, topRow: {x,w}, bbox}], tileToGroup: {tileId: groupId} }
function computeGroups(tiles) {
  // skip collapsed-state — group the bbox you SEE
  const rect = (t) => ({ x: t.x, y: t.y, w: t.w, h: t.collapsed ? COLLAPSED_H : t.h });
  const adj = (a, b) => {
    const ar = rect(a), br = rect(b);
    const horizontalTouch = Math.abs((ar.x + ar.w) - br.x) < 2 || Math.abs((br.x + br.w) - ar.x) < 2;
    const verticalTouch = Math.abs((ar.y + ar.h) - br.y) < 2 || Math.abs((br.y + br.h) - ar.y) < 2;
    const yOverlap = ar.y < br.y + br.h && br.y < ar.y + ar.h;
    const xOverlap = ar.x < br.x + br.w && br.x < ar.x + ar.w;
    return (horizontalTouch && yOverlap) || (verticalTouch && xOverlap);
  };
  // union-find
  const parent = {};
  const find = (x) => parent[x] === x ? x : parent[x] = find(parent[x]);
  const union = (a, b) => { parent[find(a)] = find(b); };
  tiles.forEach(t => parent[t.id] = t.id);
  for (let i = 0; i < tiles.length; i++) {
    for (let j = i + 1; j < tiles.length; j++) {
      if (adj(tiles[i], tiles[j])) union(tiles[i].id, tiles[j].id);
    }
  }
  const buckets = {};
  tiles.forEach(t => {
    const r = find(t.id);
    (buckets[r] ||= []).push(t);
  });
  const groups = [];
  const tileToGroup = {};
  Object.entries(buckets).forEach(([root, ts]) => {
    if (ts.length < 2) return; // single tile → no group bar
    const minY = Math.min(...ts.map(t => t.y));
    // top row = tiles whose y is at minY (within 2px)
    const topRow = ts.filter(t => Math.abs(t.y - minY) < 3).sort((a, b) => a.x - b.x);
    // top row bar spans from leftmost x to rightmost x+w of CONTIGUOUS top-row tiles
    const topX = Math.min(...topRow.map(t => t.x));
    const topW = Math.max(...topRow.map(t => t.x + t.w)) - topX;
    const bbox = {
      x: Math.min(...ts.map(t => t.x)),
      y: Math.min(...ts.map(t => t.y)),
      x2: Math.max(...ts.map(t => t.x + t.w)),
      y2: Math.max(...ts.map(t => t.y + (t.collapsed ? COLLAPSED_H : t.h))),
    };
    const id = `grp_${root}`;
    groups.push({ id, tileIds: ts.map(t => t.id), topRow: topRow.map(t => t.id),
                  topX, topW, topY: minY, bbox });
    ts.forEach(t => tileToGroup[t.id] = id);
  });
  return { groups, tileToGroup };
}

// --- Find nearest snap target during drag ----
function findSnap(movingTile, others) {
  let best = null;
  const r = { x: movingTile.x, y: movingTile.y, w: movingTile.w, h: movingTile.collapsed ? COLLAPSED_H : movingTile.h };
  others.forEach(o => {
    const or = { x: o.x, y: o.y, w: o.w, h: o.collapsed ? COLLAPSED_H : o.h };
    // check 4 sides, snap edge-to-edge if close
    // left of o
    const tryL = { x: or.x - r.w, y: or.y };
    const tryR = { x: or.x + or.w, y: or.y };
    const tryT = { x: or.x, y: or.y - r.h };
    const tryB = { x: or.x, y: or.y + or.h };
    [tryL, tryR, tryT, tryB].forEach(p => {
      const d = Math.hypot(p.x - r.x, p.y - r.y);
      if (d < SNAP_TOLERANCE && (!best || d < best.d)) best = { ...p, d };
    });
  });
  return best;
}

// --- Single Tile ----
function FloatingTile({ tile, group }) {
  const ctx = useTiles();
  const reg = ctx.registry[tile.sectionKey];
  if (!reg) return null;

  const dragRef = useRefT(null);

  const startTileDrag = (e, { ungroup = false } = {}) => {
    if (e.target.closest(".tile-btn")) return;
    e.preventDefault();
    e.stopPropagation();
    ctx.bring(tile.id);
    const startX = e.clientX, startY = e.clientY;
    const startTilePos = { x: tile.x, y: tile.y };
    let detached = ungroup;
    const others = ctx.tiles.filter(t => t.id !== tile.id);
    const groupIds = (group && !ungroup) ? group.tileIds : [tile.id];
    const groupTiles = ctx.tiles.filter(t => groupIds.includes(t.id));
    const offsets = groupTiles.map(t => ({ id: t.id, dx: t.x - startTilePos.x, dy: t.y - startTilePos.y }));

    const onMove = (ev) => {
      let nx = snap(startTilePos.x + (ev.clientX - startX));
      let ny = snap(startTilePos.y + (ev.clientY - startY));
      nx = Math.max(8, Math.min(window.innerWidth - tile.w - 8, nx));
      ny = Math.max(60, Math.min(window.innerHeight - 80, ny));
      if (detached) {
        // first move after ungroup: pull away so we don't immediately re-snap to neighbors
        nx = nx + 28;
        ny = ny + 8;
        detached = false;
      }
      if (groupTiles.length === 1) {
        const movingPreview = { ...tile, x: nx, y: ny };
        const snapTo = findSnap(movingPreview, others);
        if (snapTo) { nx = snapTo.x; ny = snapTo.y; }
      }
      const dx = nx - startTilePos.x, dy = ny - startTilePos.y;
      offsets.forEach(o => {
        ctx.updateTile(o.id, { x: snap(startTilePos.x + o.dx + dx), y: snap(startTilePos.y + o.dy + dy) });
      });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };
  const onHeaderDown = (e) => startTileDrag(e);
  const onUngroupDown = (e) => startTileDrag(e, { ungroup: true });

  const onResizeDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (tile.collapsed) return;
    const startX = e.clientX, startY = e.clientY;
    const startW = tile.w, startH = tile.h;
    const onMove = (ev) => {
      const w = Math.max(MIN_W, snap(startW + (ev.clientX - startX)));
      const h = Math.max(MIN_H, snap(startH + (ev.clientY - startY)));
      ctx.updateTile(tile.id, { w, h });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const inGroup = !!group;
  // when in a group, hide own header for tiles that are NOT the leftmost top-row tile
  // (that one shares the group bar). Other tiles still get a slim per-tile collapse/close strip.
  const isLeftmostTopRow = inGroup && group.topRow[0] === tile.id;

  const showHeader = !inGroup;
  const showSlimStrip = inGroup;

  const realH = tile.collapsed ? COLLAPSED_H : tile.h;

  return (
    <div className={`tile ${tile.collapsed ? "collapsed" : ""} ${inGroup ? "ingroup" : ""}`}
         style={{ left: tile.x, top: tile.y, width: tile.w, height: realH, zIndex: tile.z }}
         onMouseDown={() => ctx.bring(tile.id)}>
      {showHeader && (
        <div className="tile-head" onMouseDown={onHeaderDown}>

          <span className="tile-title">{reg.title}</span>
          <span className="tile-spacer"/>
          <button className="tile-btn" title={tile.collapsed ? "Expand" : "Collapse"}
                  onClick={() => ctx.updateTile(tile.id, { collapsed: !tile.collapsed })}>
            {tile.collapsed ? "▾" : "─"}
          </button>
          <button className="tile-btn" title="Close" onClick={() => ctx.closeTile(tile.id)}>×</button>
        </div>
      )}
      {showSlimStrip && (
        <div className="tile-slim" onMouseDown={onHeaderDown}>
          <span className="tile-ungroup" title="Drag to ungroup" onMouseDown={onUngroupDown}>⧉</span>
          <span className="tile-slim-title">{reg.title}</span>
          <span className="tile-spacer"/>
          <button className="tile-btn slim" title={tile.collapsed ? "Expand" : "Collapse"}
                  onClick={() => ctx.updateTile(tile.id, { collapsed: !tile.collapsed })}>
            {tile.collapsed ? "▾" : "─"}
          </button>
          <button className="tile-btn slim" title="Close" onClick={() => ctx.closeTile(tile.id)}>×</button>
        </div>
      )}
      {!tile.collapsed && (
        <div className="tile-body">
          {reg.content()}
        </div>
      )}
      {!tile.collapsed && <div className="tile-resize" onMouseDown={onResizeDown}/>}
      <style>{`

        .tile-btn:hover { color: ${SP.ink}; border-color: rgba(255,179,71,0.25);

        .tile-body { flex: 1; min-height: 0; padding: 10px; overflow: auto; }
        .tile-resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
                       cursor: nwse-resize;
                       background:
                         linear-gradient(135deg, transparent 0%, transparent 50%,
                                                 ${SP.flareGold}88 50%, ${SP.flareGold}88 60%,
                                                 transparent 60%, transparent 70%,
                                                 ${SP.flareGold}55 70%, ${SP.flareGold}55 80%,
                                                 transparent 80%);
                       opacity: 0.6; }
      `}</style>
    </div>
  );

// --- Group bar (top-row-width, with group close/collapse) ----
function GroupBar({ group }) {
  const ctx = useTiles();
  const groupTiles = useMemoT(() => ctx.tiles.filter(t => group.tileIds.includes(t.id)), [ctx.tiles, group]);
  const allCollapsed = groupTiles.every(t => t.collapsed);

  const onCollapseAll = () => {
    const next = !allCollapsed;
    groupTiles.forEach(t => ctx.updateTile(t.id, { collapsed: next }));
  };
  const onCloseGroup = () => ctx.closeGroup(group.tileIds);

  // dragging the group bar drags ALL tiles
  const onBarDown = (e) => {
    if (e.target.closest(".gbar-btn")) return;
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const starts = groupTiles.map(t => ({ id: t.id, x: t.x, y: t.y }));
    const onMove = (ev) => {
      const dx = snap(ev.clientX - startX);
      const dy = snap(ev.clientY - startY);
      starts.forEach(s => ctx.updateTile(s.id, { x: s.x + dx, y: s.y + dy }));
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // get max z of group + 1 so bar sits above
  const z = Math.max(...groupTiles.map(t => t.z)) + 1;

  return (
    <div className="gbar" style={{ left: group.topX, top: group.topY - HEADER_H + 2,
                                    width: group.topW, zIndex: z }}
         onMouseDown={onBarDown}>
      <span className="gbar-grip">⠿</span>
      <span className="gbar-title">GROUP · {groupTiles.length} tiles</span>
      <span className="gbar-spacer"/>
      <button className="gbar-btn" onClick={onCollapseAll} title={allCollapsed ? "Expand all" : "Collapse all"}>
        {allCollapsed ? "▾▾" : "──"}
      </button>
      <button className="gbar-btn" onClick={onCloseGroup} title="Close group">×</button>
      <style>{`
        .gbar { position: absolute; height: ${HEADER_H}px;
                display: flex; align-items: center; gap: 6px; padding: 0 10px;
                background: linear-gradient(180deg, rgba(255,107,26,0.18), rgba(34,12,52,0.92));
                border: 1px solid ${SP.goldBorderHot};
                border-bottom: none;
                border-radius: 12px 12px 0 0;
                backdrop-filter: blur(14px);
                cursor: grab; user-select: none;
                box-shadow: 0 -4px 18px rgba(255,107,26,0.18); }
        .gbar:active { cursor: grabbing; }
        .gbar-grip { color: ${SP.flareGold}; font-size: 11px; opacity: 0.8; }
        .gbar-title { font-family: "Space Grotesk", system-ui, sans-serif;
                      font-size: 10.5px; letter-spacing: 0.20em; color: ${SP.flareGold};
                      text-transform: uppercase; font-weight: 600; }
        .gbar-spacer { flex: 1; }
        .gbar-btn { background: transparent; border: 1px solid rgba(255,179,71,0.25);
                    color: ${SP.flareGold}; padding: 1px 8px; border-radius: 4px;
                    cursor: pointer; font-size: 11px; height: 20px; }
        .gbar-btn:hover { background: rgba(255,107,26,0.20); border-color: ${SP.flareGold}; }
      `}</style>
    </div>
  );
}

// --- Group outline (custom shape) ----
function GroupOutline({ group, tiles }) {
  const groupTiles = tiles.filter(t => group.tileIds.includes(t.id));
  const z = Math.min(...groupTiles.map(t => t.z)) - 1;
  // draw individual rect outlines around each tile (since shape is custom)
  return (
    <>
      {groupTiles.map(t => {
        const h = t.collapsed ? COLLAPSED_H : t.h;
        return (
          <div key={t.id} className="goutline"
               style={{ left: t.x - 2, top: t.y - 2, width: t.w + 4, height: h + 4, zIndex: z }}/>
        );
      })}
      <style>{`
        .goutline { position: absolute; pointer-events: none;
                    border: 1px solid ${SP.flareGold};
                    border-radius: 10px;
                    box-shadow: 0 0 0 2px rgba(255,179,71,0.10),
                                0 0 18px rgba(255,179,71,0.18);
                    opacity: 0.55; }
      `}</style>
    </>
  );
}

// --- Tile layer (renders all floating tiles) ----
function TileLayer() {
  const ctx = useTiles();
  if (!ctx) return null;
  const { groups, tileToGroup } = useMemoT(() => computeGroups(ctx.tiles), [ctx.tiles]);
  const groupMap = useMemoT(() => Object.fromEntries(groups.map(g => [g.id, g])), [groups]);

  return (
    <div className="tile-layer">
      {groups.map(g => <GroupOutline key={`o-${g.id}`} group={g} tiles={ctx.tiles}/>)}
      {ctx.tiles.map(t => {
        const g = tileToGroup[t.id] ? groupMap[tileToGroup[t.id]] : null;
        return <FloatingTile key={t.id} tile={t} group={g}/>;
      })}
      {groups.map(g => <GroupBar key={g.id} group={g}/>)}
      <style>{`
        .tile-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
        .tile-layer > * { pointer-events: auto; }
      `}</style>
    </div>
  );
}

window.TileProvider = TileProvider;
window.TileableSection = TileableSection;
window.TileLayer = TileLayer;
window.useTiles = useTiles;

        .solar-vignette { position:absolute; inset:0; box-shadow: inset 0 0 240px 90px rgba(3,0,10,0.92); }
      `}</style>
    </div>
  );
}

// ---------- Glass Sphere Node ----------
function GlassSphere({ x, y, r, color, label, selected, hover, onPointerOver, onPointerOut, onClick, intensity, showLabel, hum, flowSpeed, glowStrength }) {
  const scale = selected ? 1.45 : hover ? 1.18 : 1;
  const sr = r * scale;
  // Hit area scales with the visible node so close neighbors stay clickable.
  const hitR = sr * 1.18;
  const id = label.replace(/[^a-zA-Z0-9]/g, '');
  const dur = flowSpeed > 0.05 ? `${(2.6 / flowSpeed).toFixed(2)}s` : "0s";
  const humDur = hum > 0.05 ? `${(3.4 / hum).toFixed(2)}s` : "0s";

  return (
    <g transform={`translate(${x} ${y})`}
       onMouseEnter={onPointerOver} onMouseLeave={onPointerOut}
       onClick={onClick}
       style={{ cursor: "pointer" }}>
      <defs>
        <radialGradient id={`g-glow-${id}`} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor={color} stopOpacity="0.65"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={`g-core-${id}`} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="1"/>
          <stop offset="20%" stopColor={color} stopOpacity="1"/>
          <stop offset="60%" stopColor={color} stopOpacity="0.85"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </radialGradient>
        <radialGradient id={`g-glass-${id}`} cx="38%" cy="32%" r="65%">
          <stop offset="0%" stopColor="rgba(255,255,255,0.95)"/>
          <stop offset="22%" stopColor="rgba(255,255,255,0.18)"/>
          <stop offset="55%" stopColor="rgba(255,255,255,0)"/>
          <stop offset="92%" stopColor="rgba(0,0,0,0.55)"/>
          <stop offset="100%" stopColor="rgba(0,0,0,0.85)"/>
        </radialGradient>
        <radialGradient id={`g-rim-${id}`} cx="50%" cy="50%" r="50%">
          <stop offset="80%" stopColor="rgba(0,0,0,0)"/>
          <stop offset="92%" stopColor={color} stopOpacity="0.4"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.95"/>
        </radialGradient>
      </defs>

      {/* outer halo */}
      <circle r={sr * 2.6} fill={`url(#g-glow-${id})`} pointerEvents="none"
              opacity={(selected ? 0.85 : hover ? 0.55 : 0.35) * (0.6 + intensity * 0.4)} />
      {/* dedicated hit area, scaled to visual size */}
      <circle r={hitR} fill="transparent"
              onMouseEnter={onPointerOver} onMouseLeave={onPointerOut}
              onClick={onClick}
              style={{ cursor: "pointer" }} />
      {/* glowing inner core */}
      <circle r={sr * 0.62} fill={`url(#g-core-${id})`}
              style={{ filter: `blur(${sr * 0.18}px)` }} />
      {/* glass body */}
      <circle r={sr} fill={color} opacity="0.32" />
      {/* neon flowing motion inside the sphere (clipped to body) */}
      <clipPath id={`clip-${id}`}><circle r={sr * 0.96}/></clipPath>
      {hum > 0.05 && (
        <g clipPath={`url(#clip-${id})`}>
          <ellipse cx="0" cy="0" rx={sr*0.85} ry={sr*0.22}
                   fill={`url(#g-core-${id})`} opacity={0.7 * glowStrength}
                   style={{ mixBlendMode: "screen" }}>
            <animateTransform attributeName="transform" type="rotate"
                              from="0" to="360" dur={dur} repeatCount="indefinite"/>
            <animate attributeName="opacity"
                     values={`${0.4*glowStrength};${0.85*glowStrength};${0.4*glowStrength}`}
                     dur={humDur} repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="0" cy="0" rx={sr*0.7} ry={sr*0.18}
                   fill={color} opacity={0.5 * glowStrength}
                   style={{ mixBlendMode: "screen", filter: `blur(${sr*0.06}px)` }}>
            <animateTransform attributeName="transform" type="rotate"
                              from="60" to="-300" dur={`${(parseFloat(dur)*1.4).toFixed(2)}s`}
                              repeatCount="indefinite"/>
          </ellipse>
          <circle r={sr*0.30} fill="#fff" opacity={0.55 * glowStrength}
                  style={{ filter: `blur(${sr*0.18}px)` }}>
            <animate attributeName="r"
                     values={`${sr*0.22};${sr*0.36};${sr*0.22}`}
                     dur={humDur} repeatCount="indefinite"/>
          </circle>
        </g>
      )}
      {/* glass shading (highlight + shadow) */}
      <circle r={sr} fill={`url(#g-glass-${id})`} />
      {/* rim light */}
      <circle r={sr} fill={`url(#g-rim-${id})`} />
      {/* small core dot - the "sun inside the glass" */}
      <circle r={sr * 0.30} fill="#fff" opacity={0.95 * glowStrength}
              style={{ filter: `blur(${sr*0.05}px) drop-shadow(0 0 ${sr*0.6}px ${color})` }}/>
      {/* specular highlight */}
      <ellipse cx={-sr*0.32} cy={-sr*0.40} rx={sr*0.28} ry={sr*0.16} fill="rgba(255,255,255,0.9)" />
      <ellipse cx={-sr*0.20} cy={-sr*0.50} rx={sr*0.10} ry={sr*0.06} fill="rgba(255,255,255,1)" />
      {/* selection ring */}
      {selected && (
        <circle r={sr * 1.55} fill="none" stroke={SP.flareGold} strokeWidth="1.2" strokeDasharray="3 3"
                style={{ filter: `drop-shadow(0 0 6px ${SP.flareGold})` }}>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        </circle>
      )}
      {/* label */}
      {showLabel && (selected || hover || r >= 9) && (
        <text y={sr + 14} textAnchor="middle"
              fontFamily="IBM Plex Mono, monospace"
              fontSize={selected ? 12 : 10.5}
              fill={selected ? SP.flareGold : SP.ink}
              style={{ paintOrder: "stroke", stroke: "rgba(3,0,10,0.9)", strokeWidth: 3 }}>
          {label}
        </text>
      )}
    </g>
  );
}

// ---------- Plasma stream edge (now selectable) ----------
function PlasmaEdge({ x1, y1, x2, y2, color, hot, selected, intensity, label, showLabel,
                     onPointerOver, onPointerOut, onClick, motionScale }) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ox = -dy / len, oy = dx / len;
  const bend = Math.min(28, len * 0.12);
  const cx = mx + ox * bend;
  const cy = my + oy * bend;
  const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
  // label position on curve midpoint
  const lx = (x1 + 2*cx + x2) / 4;
  const ly = (y1 + 2*cy + y2) / 4;
  const baseW = selected ? 2.4 : hot ? 1.8 : 1.0;
  const flowSpeed = motionScale > 0.05 ? `${(selected ? 1.2 : 3) / motionScale}s` : "0s";

  return (
    <g style={{ cursor: "pointer" }}>
      {/* hit area — fat invisible stroke for easy grabbing */}
      <path d={d} stroke="transparent" strokeWidth="38" fill="none"
            strokeLinecap="round"
            onMouseEnter={onPointerOver} onMouseLeave={onPointerOut}
            onClick={onClick} pointerEvents="stroke"/>
      {/* outer glow */}
      <path d={d} stroke={color} strokeWidth={baseW * 3 * (1 + intensity * 0.4)} fill="none"
            opacity={selected ? 0.42 : hot ? 0.28 : 0.10}
            style={{ filter: `blur(2px)` }} />
      {/* core stream */}
      <path d={d} stroke={color} strokeWidth={baseW} fill="none"
            opacity={selected ? 0.95 : hot ? 0.80 : 0.40}
            strokeLinecap="round"
            style={hot || selected ? { filter: `drop-shadow(0 0 4px ${color})` } : null} />
      {/* flowing dashes */}
      {motionScale > 0.05 && (
        <path d={d} stroke={selected ? SP.flareGold : color} strokeWidth={baseW * 0.7} fill="none"
              strokeDasharray={selected ? "2 8" : "1 14"} strokeLinecap="round"
              opacity={selected ? 1 : hot ? 0.85 : 0.5}>
          <animate attributeName="stroke-dashoffset"
                   from="0" to={selected ? "-40" : "-50"} dur={flowSpeed}
                   repeatCount="indefinite"/>
        </path>
      )}
      {/* label */}
      {showLabel && (selected || hot) && label && (
        <g transform={`translate(${lx} ${ly})`}>
          <rect x="-32" y="-9" width="64" height="16" rx="8"
                fill="rgba(3,0,10,0.85)" stroke={color} strokeOpacity="0.5"/>
          <text textAnchor="middle" y="3"
                fontFamily="IBM Plex Mono, monospace" fontSize="9"
                fill={selected ? SP.flareGold : color}
                letterSpacing="0.08em">{label}</text>
        </g>
      )}
    </g>
  );
}

// ---------- Glitter wrapped to selection (cluster-depth aware) ----------
function GlitterField({ targets, color, motionScale }) {
  // targets: [{x, y, r}]
  if (!targets || targets.length === 0) return null;
  // generate ~14 particles per target
  return (
    <g pointerEvents="none">
      {targets.map((t, ti) => {
        const parts = Array.from({ length: 16 }).map((_, i) => {
          const a = (i / 16) * Math.PI * 2 + ti * 0.3;
          const dist = t.r * (0.6 + (i % 5) * 0.18);
          return {
            sx: Math.cos(a) * t.r * 0.3,
            sy: Math.sin(a) * t.r * 0.3,
            dx: Math.cos(a) * dist,
            dy: Math.sin(a) * dist,
            delay: ((ti * 7 + i * 13) % 800),
          };
        });
        const dur = motionScale > 0.05 ? `${1.4 / motionScale}s` : "1.4s";
        return (
          <g key={ti} transform={`translate(${t.x} ${t.y})`}>
            {parts.map((p, i) => (
              <circle key={i} cx={p.sx} cy={p.sy} r="1.2" fill={color}
                      style={{ filter: `drop-shadow(0 0 3px ${color})` }}>
                <animate attributeName="cx" from={p.sx} to={p.dx} dur={dur}
                         begin={`${p.delay}ms`} repeatCount="indefinite"/>
                <animate attributeName="cy" from={p.sy} to={p.dy} dur={dur}
                         begin={`${p.delay}ms`} repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0;1;0" dur={dur}
                         begin={`${p.delay}ms`} repeatCount="indefinite"/>
                <animate attributeName="r" values="0.6;1.6;0.4" dur={dur}
                         begin={`${p.delay}ms`} repeatCount="indefinite"/>
              </circle>
            ))}
          </g>
        );
      })}
    </g>
  );
}

// ---------- Minimap (with rotation + viewport tracking) ----------
function Minimap({ camera, setCamera, selected, setSelected, size }) {
  const W = 220, H = 160;
  const onClickPos = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    setCamera(c => ({ ...c, x, y }));
  };

  // viewport rect in model space → minimap px
  const viewW = 1 / camera.zoom;
  const viewH = (size.h / size.w) / camera.zoom;
  const vx = (camera.x - viewW / 2) * W;
  const vy = (camera.y - viewH / 2) * H;
  const vw = viewW * W;
  const vh = viewH * H;

  return (
    <div className="minimap-wrap">
      <div className="mm-head">
        <span className="mm-title">MINIMAP · n={GRAPH.nodes.length}</span>
        <span className="mm-zoom">×{camera.zoom.toFixed(2)} · {Math.round(camera.rot)}°</span>
      </div>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}
           className="mm-svg" onClick={onClickPos}>
        <rect x="0" y="0" width={W} height={H} fill="rgba(3,0,10,0.55)" />
        <g transform={`rotate(${camera.rot} ${W/2} ${H/2})`}>
          {GRAPH.edges.map((e, i) => {
            const a = GRAPH.nodes[e.source], b = GRAPH.nodes[e.target];
            return (
              <line key={i}
                    x1={a.x * W} y1={a.y * H}
                    x2={b.x * W} y2={b.y * H}
                    stroke="rgba(79,172,255,0.20)" strokeWidth="0.4"/>
            );
          })}
          {GRAPH.nodes.map((n, i) => (
            <circle key={i} cx={n.x * W} cy={n.y * H}
                    r={Math.max(1.2, n.r * 0.16)}
                    fill={n.color}
                    opacity={selected === i ? 1 : 0.85}
                    onClick={(e) => { e.stopPropagation(); setSelected(i); }}
                    style={{ cursor: "pointer", filter: selected === i
                      ? `drop-shadow(0 0 6px ${SP.flareGold})`
                      : `drop-shadow(0 0 2px ${n.color})` }}/>
          ))}
          {selected != null && (() => {
            const n = GRAPH.nodes[selected];
            return <circle cx={n.x * W} cy={n.y * H} r="6" fill="none"
                           stroke={SP.flareGold} strokeWidth="1"
                           pointerEvents="none"
                           style={{ filter: `drop-shadow(0 0 6px ${SP.flareGold})` }}/>;
          })()}
        </g>
        {/* viewport rect (unrotated, draws what's visible) */}
        <g transform={`rotate(${camera.rot} ${W/2} ${H/2})`}>
          <rect x={vx} y={vy} width={vw} height={vh}
                fill="rgba(255,179,71,0.10)"
                stroke={SP.flareGold} strokeWidth="1" strokeDasharray="2 2"
                pointerEvents="none"/>
        </g>
      </svg>
      <div className="mm-foot">click → pan · L-drag pan · R-drag rotate · scroll zoom</div>
      <style>{`
        .minimap-wrap {
          padding: 10px;
          background: linear-gradient(180deg, rgba(34,12,52,0.78), rgba(11,4,22,0.85));
          border: 1px solid ${SP.goldBorder};
          border-radius: 12px;
          backdrop-filter: blur(14px) saturate(140%);
          box-shadow: 0 0 0 1px rgba(255,179,71,0.10) inset, 0 8px 24px rgba(0,0,0,0.5),
                      0 0 30px rgba(255,107,26,0.10);
        }
        .mm-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 6px; }
        .mm-title { font-family: "Space Grotesk", system-ui, sans-serif;
                    font-size: 10px; letter-spacing: 0.18em; color: ${SP.flareGold}; }
        .mm-zoom { font-family: "IBM Plex Mono", ui-monospace, monospace;
                   font-size: 10px; color: ${SP.coronaCyan}; }
        .mm-svg { display:block; border-radius: 6px;
                  border: 1px solid rgba(255,179,71,0.15);
                  cursor: crosshair; }
        .mm-foot { font-family: "IBM Plex Mono", ui-monospace, monospace;
                   font-size: 8.5px; color: ${SP.muted}; margin-top: 5px;
                   text-align: center; letter-spacing: 0.08em; }
      `}</style>
    </div>
  );
}

// ---------- Draggable Inspector ----------
function DraggableInspector({ selectedNode, selectedEdgeInfo }) {
  const [pos, setPos] = useState({ x: 18, y: 18 });

  const onMouseDown = (e) => {
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY, ox: pos.x, oy: pos.y };
    const onMove = (ev) => {
      setPos({ x: start.ox + ev.clientX - start.x, y: start.oy + ev.clientY - start.y });
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const n = selectedNode;
  const showEdge = !!selectedEdgeInfo && !n;
  return (
    <div className="dins" style={{ left: pos.x, top: pos.y }}>
      <div className="dins-head" onMouseDown={onMouseDown}>
        <span className="dh-grip">⠿</span>
        <span className="dh-title">{showEdge ? "EDGE INSPECTOR" : "GRAPH INSPECTOR"}</span>
        <span className="dh-spacer" />
        <span className="dh-btn" title="pop out">▭</span>
        <span className="dh-btn" title="collapse">─</span>
      </div>
      <div className="dins-body">
        {showEdge ? <EdgeBody info={selectedEdgeInfo}/> : <NodeBody n={n}/>}
      </div>
      <style>{`
        .dins { position: absolute; width: 300px; z-index: 30;
                background: linear-gradient(180deg, rgba(34,12,52,0.82), rgba(11,4,22,0.92));
                border: 1px solid ${SP.goldBorderHot};
                border-radius: 14px;
                backdrop-filter: blur(18px) saturate(140%);
                box-shadow: 0 0 0 1px rgba(255,179,71,0.18) inset,
                            0 12px 40px rgba(0,0,0,0.6),
                            0 0 50px rgba(255,107,26,0.18);
                user-select: none; }
        .dins-head { display:flex; align-items:center; gap: 8px;
                     padding: 8px 12px;
                     border-bottom: 1px solid rgba(255,179,71,0.18);
                     cursor: grab; }
        .dins-head:active { cursor: grabbing; }
        .dh-grip { color: ${SP.flareGold}; font-size: 12px; opacity: 0.7; }
        .dh-title { font-family: "Space Grotesk", system-ui, sans-serif;
                    font-size: 10px; letter-spacing: 0.20em; color: ${SP.flareGold}; }
        .dh-spacer { flex: 1; }
        .dh-btn { color: ${SP.muted}; font-size: 11px; cursor: pointer; padding: 0 4px; }
        .dh-btn:hover { color: ${SP.ink}; }
        .dins-body { padding: 12px; }
      `}</style>
    </div>
  );
}

    <div className="di-bar"><div className="di-fill" style={{ width: n ? `${Math.min(95, 30 + n.degree * 7)}%` : "0%" }}/></div>

    <div className="di-tags">
      {n && <>

// ---------- Camera HUD ----------
function CameraHUD({ camera, setCamera }) {

// ---------- Graph Canvas ----------
function GraphCanvas({ intensity, reduceMotion, glitter, motionScale, clusterDepth, edgeLabels, nodeHum, nodeFlowSpeed, nodeGlow }) {
  const wrapRef = useRef(null);
  const [size, setSize] = useState({ w: 1200, h: 720 });
  const [camera, setCamera] = useState({ x: 0.5, y: 0.5, zoom: 1.0, rot: 0 });
  const [animCam, setAnimCam] = useState(camera);
  const [hover, setHover] = useState(null);
  const [hoverEdge, setHoverEdge] = useState(null);
  const [selected, setSelected] = useState(null);
  const [selectedEdge, setSelectedEdge] = useState(null);
  const [halos, setHalos] = useState([]);

  // smooth cam follow
  useEffect(() => {
    const start = animCam;
    const target = camera;
    const startTime = performance.now();
    const dur = 380;
    let raf;
    const tick = (t) => {
      const k = Math.min(1, (t - startTime) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      setAnimCam({
        x: start.x + (target.x - start.x) * e,
        y: start.y + (target.y - start.y) * e,
        zoom: start.zoom + (target.zoom - start.zoom) * e,
        rot: start.rot + (target.rot - start.rot) * e,
      });
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [camera.x, camera.y, camera.zoom, camera.rot]);

  useEffect(() => {
    if (!wrapRef.current) return;
    const ro = new ResizeObserver((entries) => {
      const { width, height } = entries[0].contentRect;
      setSize({ w: width, h: height });
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  // model → screen with rotation
  const project = useCallback((nx, ny) => {
    const cx = animCam.x, cy = animCam.y, z = animCam.zoom;
    const rad = (animCam.rot * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    // shift to center, rotate, then scale
    const aspect = size.h / size.w;
    let dx = (nx - cx);
    let dy = (ny - cy) * aspect;
    const rx = dx * cos - dy * sin;
    const ry = dx * sin + dy * cos;
    return { x: rx * z * size.w + size.w / 2, y: ry * z * size.w / aspect / aspect + size.h / 2 };
  }, [animCam, size]);

  // simpler projection (no aspect distortion)
  const project2 = useCallback((nx, ny) => {
    const cx = animCam.x, cy = animCam.y, z = animCam.zoom;
    const rad = (animCam.rot * Math.PI) / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const dx = (nx - cx);
    const dy = (ny - cy);
    const rx = dx * cos - dy * sin;
    const ry = dx * sin + dy * cos;
    return { x: rx * z * size.w + size.w / 2, y: ry * z * size.w + size.h / 2 };
  }, [animCam, size]);

  const projected = useMemo(() => GRAPH.nodes.map((n) => {
    const p = project2(n.x, n.y);
    return { ...n, sx: p.x, sy: p.y };
  }), [project2]);

  // mouse interactions: pan / rotate / wheel zoom
  const dragRef = useRef(null);
  const onMouseDown = (e) => {
    if (e.button !== 0 && e.button !== 2) return;
    e.preventDefault();
    const startCam = { ...camera };
    const sx = e.clientX, sy = e.clientY;
    const button = e.button;
    dragRef.current = { moved: false };
    const onMove = (ev) => {
      const dx = ev.clientX - sx;
      const dy = ev.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragRef.current.moved = true;
      if (button === 0) {
        // pan: convert px to model space
        const rad = (startCam.rot * Math.PI) / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const mx = dx / (size.w * startCam.zoom);
        const my = dy / (size.w * startCam.zoom);
        const px = mx * cos + my * sin;
        const py = -mx * sin + my * cos;
        setCamera({ ...startCam, x: startCam.x - px, y: startCam.y - py });
      } else if (button === 2) {
        const rotDelta = dx * 0.4;
        setCamera({ ...startCam, rot: startCam.rot + rotDelta });
      }
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  const onWheel = (e) => {
    e.preventDefault();
    const delta = -e.deltaY;
    setCamera(c => ({ ...c, zoom: Math.max(0.4, Math.min(6, c.zoom * (1 + delta * 0.0015))) }));
  };

  // canvas click: halo + clear selection (only if didn't drag)
  const onCanvasClick = (e) => {
    if (dragRef.current?.moved) return;
    const t = e.target;
    const isBg = t === e.currentTarget || t.classList?.contains("canvas-bg-rect");
    if (!isBg) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    // Alt+Shift+click on bg → open inspector for nearest node
    if (e.altKey && e.shiftKey) {
      let best = -1, bestD = Infinity;
      projected.forEach((p, i) => {
        const d = Math.hypot(p.sx - x, p.sy - y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) {
        const n = projected[best];
        window.dispatchEvent(new CustomEvent("inspector:open", { detail: {
          kind: "node", sx: n.sx + rect.left, sy: n.sy + rect.top,
          label: n.label, color: n.color, r: n.r, intensity: 1,
          cluster: KIND[n.kind]?.label, ref: best,
        }}));
      }
      return;
    }
    const id = Math.random().toString(36).slice(2);
    const maxR = Math.min(size.w, size.h) * 0.25;
    setHalos(h => [...h, { id, x, y, maxR }]);
    setTimeout(() => setHalos(h => h.filter(p => p.id !== id)), 1500);
    setSelected(null);
    setSelectedEdge(null);
  };

  // Alt+Shift+click on a node → inspector
  const onNodeAltClick = (i, e) => {
    if (!(e.altKey && e.shiftKey)) return false;
    e.stopPropagation();
    const rect = wrapRef.current.getBoundingClientRect();
    const n = projected[i];
    window.dispatchEvent(new CustomEvent("inspector:open", { detail: {
      kind: "node", sx: n.sx + rect.left, sy: n.sy + rect.top,
      label: n.label, color: n.color, r: n.r, intensity: 1,
      cluster: KIND[n.kind]?.label, ref: i,
    }}));
    return true;
  };
  const onEdgeAltClick = (i, e) => {
    if (!(e.altKey && e.shiftKey)) return false;
    e.stopPropagation();
    const ed = GRAPH.edges[i];
    const A = projected[ed.source], B = projected[ed.target];
    const rect = wrapRef.current.getBoundingClientRect();
    window.dispatchEvent(new CustomEvent("inspector:open", { detail: {
      kind: "edge",
      sx: ((A.sx + B.sx) / 2) + rect.left,
      sy: ((A.sy + B.sy) / 2) + rect.top,
      fromLabel: A.label, toLabel: B.label,
      color: A.color, r: 6, intensity: 1, ref: i,
    }}));
    return true;
  };

  const selectNode = (i) => {
    setSelected(i);
    setSelectedEdge(null);
  };
  const selectEdge = (idx) => {
    setSelectedEdge(idx);
    setSelected(null);
  };

  const selectedNode = selected != null ? GRAPH.nodes[selected] : null;
  const selectedEdgeInfo = selectedEdge != null ? (() => {
    const e = GRAPH.edges[selectedEdge];
    const a = GRAPH.nodes[e.source], b = GRAPH.nodes[e.target];
    return { a, b, color: a.color, label: `${a.label.slice(0,5)}→${b.label.slice(0,5)}` };
  })() : null;

  // BFS for cluster depth
  const adj = useMemo(() => {
    const m = {};
    GRAPH.nodes.forEach((_, i) => m[i] = []);
    GRAPH.edges.forEach(e => { m[e.source].push(e.target); m[e.target].push(e.source); });
    return m;
  }, []);
  const selectionGroup = useMemo(() => {
    if (selected == null) return new Set();
    const out = new Set([selected]);
    let frontier = [selected];
    for (let d = 0; d < clusterDepth; d++) {
      const next = [];
      frontier.forEach(i => adj[i].forEach(j => { if (!out.has(j)) { out.add(j); next.push(j); } }));
      frontier = next;
    }
    return out;
  }, [selected, clusterDepth, adj]);

  const glitterTargets = useMemo(() => {
    if (!glitter || selected == null) return [];
    return [...selectionGroup].map(i => {
      const n = projected[i];
      return { x: n.sx, y: n.sy, r: n.r * Math.min(1.5, animCam.zoom) * 1.4 };
    });
  }, [selectionGroup, glitter, selected, projected, animCam.zoom]);

  const glitterColor = selected != null ? GRAPH.nodes[selected].color : SP.flareGold;

  return (
    <section className="canvas-wrap" ref={wrapRef}
             data-screen-label="solar-plasma-graph"
             onMouseDown={onMouseDown}
             onClick={onCanvasClick}
             onWheel={onWheel}
             onContextMenu={(e) => e.preventDefault()}>
      <SolarBackdrop intensity={intensity} motionScale={reduceMotion ? 0 : motionScale} />

      <svg className="graph-svg" width={size.w} height={size.h}>
        <rect className="canvas-bg-rect" x="0" y="0" width="100%" height="100%" fill="transparent" />
        {/* edges */}
        <g>
          {GRAPH.edges.map((e, i) => {
            const A = projected[e.source], B = projected[e.target];
            const color = KIND[A.kind].color;
            const isSel = selectedEdge === i;
            const isHot = hoverEdge === i ||
                          (selected != null && (e.source === selected || e.target === selected));
            return (
              <PlasmaEdge key={i}
                          x1={A.sx} y1={A.sy} x2={B.sx} y2={B.sy}
                          color={color}
                          hot={isHot}
                          selected={isSel}
                          intensity={intensity}
                          motionScale={reduceMotion ? 0 : motionScale}
                          label={`${A.label.slice(0,4)}→${B.label.slice(0,4)}`}
                          showLabel={edgeLabels}
                          onPointerOver={() => setHoverEdge(i)}
                          onPointerOut={() => setHoverEdge(h => h === i ? null : h)}
                          onClick={(ev) => { if (onEdgeAltClick(i, ev)) return; ev.stopPropagation(); selectEdge(i); }}/>
            );
          })}
        </g>
        {/* glitter wrapped to selection group */}
        <GlitterField targets={glitterTargets} color={glitterColor}
                      motionScale={reduceMotion ? 0 : motionScale}/>
        {/* nodes */}
        <g>
          {projected.map((n, i) => (
            <GlassSphere key={n.id}
                         x={n.sx} y={n.sy} r={n.r * Math.min(1.5, animCam.zoom)}
                         color={n.color} label={n.label}
                         selected={selected === i}
                         hover={hover === i || selectionGroup.has(i)}
                         onPointerOver={() => setHover(i)}
                         onPointerOut={() => setHover(h => h === i ? null : h)}
                         onClick={(e) => { if (onNodeAltClick(i, e)) return; e.stopPropagation(); selectNode(i); }}
                         intensity={intensity}
                         hum={reduceMotion ? 0 : nodeHum}
                         flowSpeed={reduceMotion ? 0 : nodeFlowSpeed}
                         glowStrength={nodeGlow}
                         showLabel={true}/>
          ))}
        </g>
      </svg>

      <ClickHalo halos={halos} />

      {BOOKMARKS.map(b => <Bookmark key={b.id} b={b} size={size} reduceMotion={reduceMotion}/>)}

      <DraggableInspector selectedNode={selectedNode} selectedEdgeInfo={selectedEdgeInfo} />

      <div className="minimap-pos">
        <Minimap camera={camera} setCamera={setCamera}
                 selected={selected} setSelected={(i)=>selectNode(i)}
                 size={size}/>
      </div>

      <CameraHUD camera={camera} setCamera={setCamera}/>

      <div className="center-readout">
        <div className="cr-line">CORONA · {GRAPH.nodes.length} bodies · {GRAPH.edges.length} streams · cluster-depth {clusterDepth}</div>
      </div>

      <style>{`
        .canvas-wrap { position: relative; height: 100%; overflow: visible; cursor: grab; }
        .canvas-wrap:active { cursor: grabbing; }
        .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        .minimap-pos { position: absolute; right: 16px; bottom: 60px; z-index: 6; }
        .center-readout { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6; }
        .cr-line {
          font-family: "IBM Plex Mono", ui-monospace, monospace;
          font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
          color: ${SP.flareGold};
          padding: 5px 14px; border-radius: 999px;
          border: 1px solid rgba(255,179,71,0.25);
          background: rgba(11,4,22,0.7);
          backdrop-filter: blur(8px);
        }
      `}</style>
    </section>
  );
}

window.GraphCanvas = GraphCanvas;

    </script>

function DockSection({ title, open, onToggle, icon, sectionKey, children }) {
  const ctx = window.useTiles && window.useTiles();
  const tiledOut = ctx && sectionKey ? ctx.isTiledOut(sectionKey) : false;
  const startTearOff = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (!ctx || tiledOut) return;
    const sx = e.clientX, sy = e.clientY; let dragging = false;
    const onMove = (ev) => {
      if (!dragging && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8) {
        dragging = true;
        ctx.tileOut(sectionKey, { x: ev.clientX - 60, y: ev.clientY - 14 });
      }
    };
    const onUp = () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };
  return (
    <div className={`dsec ${tiledOut ? "dtiled" : ""}`}>
      <button className="dsec-head" onClick={onToggle} disabled={tiledOut}>
        <span className="dsec-icon">{icon}</span>
        <span className="dsec-title">{title}</span>
        <span className="dsec-tear" title="Tear off" onMouseDown={startTearOff}>⤴</span>
        <span className="dsec-caret">{open ? "▾" : "▸"}</span>
      </button>
      {open && !tiledOut && <div className="dsec-body">{children}</div>}
      {tiledOut && <div className="dsec-ghost">Tiled out</div>}
      <style>{`
        .dsec { margin-bottom: 12px; }

                     background: linear-gradient(90deg, rgba(255,107,26,0.12), transparent 70%);

                     cursor: pointer;
