<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Minimap — interactive prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #060912; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Mocks (prototype-only). In real app: useSettingsStore, graphology, Sigma. -->
<script type="text/babel" src="_minimap-prototype/mock-stores.jsx"></script>

<!-- Hooks (port 1:1 to .ts). Subscribe to window.__lwSigma. -->
<script type="text/babel" src="_minimap-prototype/use-minimap-snapshot.jsx"></script>
<script type="text/babel" src="_minimap-prototype/use-minimap-camera.jsx"></script>
<script type="text/babel" src="_minimap-prototype/use-minimap-navigation.jsx"></script>

<!-- Components (port 1:1 to .tsx). -->
<script type="text/babel" src="_minimap-prototype/minimap-snapshot-canvas.jsx"></script>
<script type="text/babel" src="_minimap-prototype/minimap-viewport-rect.jsx"></script>
<script type="text/babel" src="_minimap-prototype/minimap-chrome.jsx"></script>
<script type="text/babel" src="_minimap-prototype/minimap-shell.jsx"></script>
<script type="text/babel" src="_minimap-prototype/minimap.jsx"></script>

<!-- Harness (NOT ported; AppShell stays the host site). -->
<script type="text/babel" src="_minimap-prototype/prototype-harness.jsx"></script>
</body>
</html>
