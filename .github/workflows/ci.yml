name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-css:
    name: CSS Logical Properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:graph
      - run: npm run typecheck

  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    needs: [lint-css, typecheck]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        total: [5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Generate self-graph fixture
        run: npm run generate:graph
      - name: Run E2E tests (Shard ${{ matrix.shard }}/${{ matrix.total }})
        run: npm run qa:e2e -- --shard=${{ matrix.shard }}/${{ matrix.total }} --workers=4 --timeout=60000
        timeout-minutes: 20
