# LumaWeave Documentation Frontmatter Rules
#
# Declarative schema config for normalizing YAML frontmatter across docs/.
# Consumed by scripts/normalize-frontmatter.mjs.
#
# Schema rules (applied in this order):
#   1. field_renames    — rename old field name → new field name (preserves value)
#   2. field_removals   — delete fields entirely
#   3. field_remaps     — within-field value remap (e.g. status: active → current)
#   4. field_defaults   — set field IF AND ONLY IF the field is currently absent
#   5. field_overrides  — set field unconditionally to a fixed value
#   6. last_updated_today — if true, set last_updated to today's ISO date
#
# Validation rules:
#   - required_fields: error if missing
#   - status_options: error if status is not one of these values
#
# ────────────────────────────────────────────────────────────
# Status vocabulary (locked v86a, 5 values):
#
#   current   — actively maintained, reflects today's reality
#   accepted  — frozen at acceptance, reference state
#   complete  — finished work product (e.g. session summary, snapshot)
#   concept   — design exists, no/limited implementation yet
#   archived  — removed from active flow, kept for record
#
# ────────────────────────────────────────────────────────────
# Cluster color palette (locked v86a, 9 colors):
#
# Source of truth for hex values: docs/_meta/cluster-colors.json
#
#   gold     — Theme / Visual System              #FFB347
#   azure    — Graph / Rendering / Handles        #3D8BD8
#   violet   — Agent / Brain / Operating          #8B5CF6
#   teal     — Visual Grammar Engine              #14B8A6
#   lime     — Source / Data Ingestion            #84CC16
#   slate    — Control Plane / QA / Registries    #64748B
#   stone    — Layout / UI Shell                  #A8A29E
#   ember    — Audio / Reactive                   #D8541F
#   crimson  — Accessibility / Safety             #DC2626
#   indigo   — Platform / Vision / VR             #6366F1
#
# ────────────────────────────────────────────────────────────
# FUTURE CAPABILITIES (not yet implemented — design recorded for future)
#
# 1. field_derivers — compute values from observable inputs (title from H1, id from path)
# 2. force_add_frontmatter (per-schema) — generate frontmatter on docs that lack it
# 3. Reasonable per-cluster defaults for type/tags
# ────────────────────────────────────────────────────────────

version: 1

# Defaults applied to ALL schemas unless overridden:
defaults:
  last_updated_today: true
  field_renames:
    related: references
  # Cleanup of legacy values across all docs:
  field_remaps:
    status:
      active: current
      historical: archived
      design-locked: concept
    cluster:
      # Legacy color names → palette names (v86a migration)
      purple: violet      # agent docs were tagged 'purple', now 'violet'
      blue: azure         # graph docs were tagged 'blue', now 'azure'
      green: lime         # source-adapter docs were tagged 'green', now 'lime'
      red: crimson        # any 'red' brain docs caught earlier
      gray: violet        # any 'gray' brain docs (changelog had this)

