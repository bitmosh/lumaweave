  agent_brain:
    path_match: '^agent/brain/'
    cluster: violet
    status_options: [current, accepted, complete, archived]
    field_overrides:
      cluster: violet
      last_pass: 'vP-Forensics-2'
    field_removals:
      - version
    field_defaults:
      status: current
      type: log
      domain: agent
      subdomain: brain
      agent_readable: true
      include_in_self_graph: false
    required_fields:
      - id
      - title
      - type
      - status
      - cluster
      - domain
      - subdomain
      - last_updated
      - last_pass

