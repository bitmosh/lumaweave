# LumaWeave Documentation Frontmatter Rules
#
# Declarative schema config for normalizing YAML frontmatter across docs/.
# Consumed by scripts/normalize-frontmatter.mjs.
#
# How matching works:
#   1. The script walks docs/ recursively for .md files
#   2. For each file, the path-relative-to-docs/ is matched against schemas
#      in order (top to bottom)
#   3. The FIRST schema whose `path_match` regex matches wins
#   4. The schema's rules are applied in order
#   5. Schemas with `path_match: null` are stub schemas — declared for
#      future use, not yet active
#
# Schema rules (applied in this order):
#   1. field_renames    — rename old field name → new field name (preserves value)
#   2. field_removals   — delete fields entirely
#   3. field_remaps     — within-field value remap (e.g. status: active → current)
#   4. field_defaults   — set field IF AND ONLY IF the field is currently absent
#   5. field_overrides  — set field unconditionally to a fixed value
#   6. last_updated_today — if true, set last_updated to today's ISO date
#
# Validation rules describe what the doc SHOULD have after normalization:
#   - required_fields: error if missing
#   - status_options: error if status is not one of these values
#
# When validation fails, the script reports the issue but does NOT block
# writes (unless --strict is set). This lets you progressively normalize.
#
# ────────────────────────────────────────────────────────────
# Status vocabulary (locked v86a, refined to 5 values):
#
#   current       — actively maintained, reflects today's reality
#                   (covers former 'active' usage too)
#   accepted      — frozen at acceptance, reference state
#   complete      — finished work product (e.g. session summary, snapshot)
#   archived      — removed from active flow, kept for record
#                   (covers former 'historical' usage too)
#   design-locked — design intentionally frozen, no implementation yet
#                   (VGE only)
#
# Different doc types use different subsets of this vocabulary. Each
# schema declares its allowed `status_options`.
# ────────────────────────────────────────────────────────────
#
# ────────────────────────────────────────────────────────────
# FUTURE CAPABILITIES (not yet implemented — design recorded for future)
# ────────────────────────────────────────────────────────────
#
# The current script normalizes existing frontmatter but does NOT generate
# frontmatter for docs that lack it. Three additions would close that gap
# without requiring human judgment on every field:
#
# 1. field_derivers — compute values from observable inputs
#    Schema picks which named derivers to run. Library of derivers in
#    the script:
#      - first_h1: title := first H1 in body
#      - path_to_dotpath: id := relative path slugified to dot-notation
#                         (e.g. theme/THEME_SYSTEM_OVERVIEW.md
#                         → theme.system.overview)
#      - parent_dir: subdomain := parent folder name
#    Example:
#      agent_brain:
#        field_derivers:
#          title: first_h1
#          id: path_to_dotpath
#
# 2. force_add_frontmatter: true (per-schema)
#    Currently the script refuses to add frontmatter to docs without it
#    (safety). With this flag, the script can generate frontmatter from
#    field_defaults + field_derivers + field_overrides + last_updated.
#    Schema controls per-domain whether generation is allowed.
#
# 3. Reasonable per-cluster defaults for type/tags
#    Add to field_defaults so generation has sensible starting state:
#      agent_brain:
#        field_defaults:
#          type: log
#          tags: [agent, bandit, brain]
#    'references' deliberately stays human-judgment (left as []).
#
# Field categories:
#   Category 1 — fully derivable from path + schema (current capability):
#     cluster, domain, subdomain, status, last_pass, last_updated,
#     agent_readable, include_in_self_graph
#   Category 2 — mechanically derivable from file content (future):
#     title (first_h1), id (path_to_dotpath)
#   Category 3 — genuinely human-judgment (always manual):
#     references — body cross-refs require semantic understanding
#     type — sometimes derivable from path, sometimes not; default OK
#     tags — keyword judgment; default OK as starting point
#
# Add when needed: if we get a flood of new docs without frontmatter
# (operator quick-drafts, agent outputs, etc.), implement these to keep
# the cost of "starting a new doc" low. Until then, hand-crafted
# frontmatter from rewrites is fine.
# ────────────────────────────────────────────────────────────

version: 1

# Defaults applied to ALL schemas unless overridden:
defaults:
  last_updated_today: true
  field_renames:
    related: references
  # Cleanup of legacy status vocabulary across all docs:
  field_remaps:
    status:
      active: current
      historical: archived

schemas:

  # ============================================================
  # Agent / Brain — Bandit's operating documents
  # ============================================================
  agent_brain:
    path_match: '^agent/brain/'
    cluster: purple
    status_options: [current, accepted, complete, archived]
    field_overrides:
      cluster: purple
      last_pass: 'vP-Forensics-2'
    field_removals:
      - version  # superseded by last_pass
    field_defaults:
      status: current
      type: log
      domain: agent
      subdomain: brain
      agent_readable: true
      include_in_self_graph: false
    required_fields:
      - id
      - title
      - type
      - status
      - cluster
      - domain
      - subdomain
      - last_updated
      - last_pass

  # ============================================================
